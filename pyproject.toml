[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-pitwall"
version = "0.1.0"
description = "F1 Data and Intelligence Hub — Phase 1"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "tzdata>=2024.1",
    "defusedxml>=0.7,<1",
    "fastf1>=3.8,<3.9",
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]
research-asr = [
    "faster-whisper==1.2.1",
    "psutil==7.2.2",
]

[tool.setuptools.package-data]
"f1_pitwall" = ["models/*.joblib", "models/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = ["network: real public-provider integration and acceptance checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
